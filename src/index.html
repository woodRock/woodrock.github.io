<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{url}}/">
  <link rel="canonical" href="{{url}}/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="/" aria-label="{{name}}, home">{{name}}</a>
      <nav aria-label="Primary">
        <ul class="nav-list">
          <li><a href="#about">About</a></li>
          <li><a href="#research">Research</a></li>
          <li><a href="#publications">Publications</a></li>
          <li><a href="#projects">Projects</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">

    <section class="hero" aria-labelledby="hero-heading">
      <p class="eyebrow">{{role}}</p>
      <h1 id="hero-heading">{{name}}</h1>
      <p class="lede">{{tagline}}</p>
      <p class="muted">{{affiliation}}</p>
      <ul class="link-row" aria-label="Contact links">
        <li><a href="mailto:{{email}}">Email</a></li>
        {{hero_links}}
      </ul>
    </section>

    <section id="about" class="section" aria-labelledby="about-heading">
      <h2 id="about-heading">About</h2>
      {{about}}
    </section>

    <section id="research" class="section" aria-labelledby="research-heading">
      <h2 id="research-heading">Research</h2>
      {{research}}
    </section>

    <section id="publications" class="section" aria-labelledby="publications-heading">
      <h2 id="publications-heading">Publications</h2>
      <ol class="pub-list" reversed>
        {{publications}}
      </ol>
    </section>

    <section id="projects" class="section" aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <ul class="project-list">
        {{projects}}
      </ul>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© {{year}} {{name}}</p>
      <p><a href="{{repo}}">Source</a></p>
    </div>
  </footer>
</body>
</html>
